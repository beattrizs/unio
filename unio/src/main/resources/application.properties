spring.application.name=matchmaking-backend
spring.profiles.active=dev
management.endpoints.web.exposure.include=health,info

# Validade do token JWT de login (em minutos) - 1 hora
app.jwt.expiration-minutes=60

# Recuperação de senha
# Validade do link de redefinição (em minutos) e página do front que recebe o ?token=...
app.password-reset.expiration-minutes=60
app.password-reset.frontend-url=http://localhost:5173/redefinir-senha
